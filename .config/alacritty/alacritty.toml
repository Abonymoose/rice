# rice - alacritty config, dark grey/black aesthetic

[window]
opacity = 0.85
padding = { x = 8, y = 8 }
decorations = "none"

[font]
size = 12

[font.normal]
family = "monospace"

[colors.primary]
background = "#000000"
foreground = "#cccccc"

[colors.cursor]
text = "#000000"
cursor = "#cccccc"

[colors.normal]
black   = "#000000"
red     = "#2a2a2a"
green   = "#2a2a2a"
yellow  = "#2a2a2a"
blue    = "#2a2a2a"
magenta = "#2a2a2a"
cyan    = "#2a2a2a"
white   = "#cccccc"

[colors.bright]
black   = "#1a1a1a"
red     = "#cccccc"
green   = "#cccccc"
yellow  = "#cccccc"
blue    = "#cccccc"
magenta = "#cccccc"
cyan    = "#cccccc"
white   = "#cccccc"

[cursor]
style = { shape = "Block", blinking = "On" }

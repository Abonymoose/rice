[colors]
background = #eef5f5f5
foreground = #000000
accent = #cccccc
dark = #333333

[bar/main]
width = 100%
height = 28
offset-x = 8
offset-y = 8
radius = 8
background = ${colors.background}
foreground = ${colors.foreground}
line-color = ${colors.accent}
border-size = 1
border-color = ${colors.accent}
padding-left = 2
padding-right = 2
module-margin = 2
font-0 = monospace:pixelsize=11;2

modules-left = workspaces
modules-center = time
modules-right = battery volume bluetooth notifications

[module/workspaces]
type = internal/i3
format = <label-state>
label-focused = %name%
label-focused-foreground = ${colors.dark}
label-focused-underline = ${colors.dark}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.accent}
label-unfocused-padding = 1

[module/time]
type = internal/date
interval = 1
date = %H:%M:%S
format = <label>
label = %time%
label-foreground = ${colors.dark}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging = BAT: %percentage%%%
label-discharging = BAT: %percentage%%%
label-full = BAT: %percentage%%%
label-foreground = ${colors.dark}

[module/volume]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL: %percentage%%%
format-muted = <label-muted>
label-muted = VOL: MUTED
label-volume-foreground = ${colors.dark}
label-muted-foreground = ${colors.accent}

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5
format = <label>
label-foreground = ${colors.dark}

[module/notifications]
type = custom/script
exec = ~/.config/polybar/scripts/notifications.sh
interval = 2
format = <label>
label-foreground = ${colors.dark}
click-left = dunstctl set-paused toggle

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0

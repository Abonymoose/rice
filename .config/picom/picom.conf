# rice - picom config, unified B/W minimal theme

backend = "xrender";
vsync = false;

# Blur
blur-method = "gaussian";
blur-strength = 5;
blur-background = false;
blur-background-exclude = [
    "class_g = 'polybar'"
];

# Rounded corners
corner-radius = 15;
round-borders = 1;

# Opacity
active-opacity = 0.85;
inactive-opacity = 0.85;
frame-opacity = 0.85;

# Shadows - subtle
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.25;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
    "class_g = 'polybar'",
    "class_g = 'Alacritty'"
];

# Fading - smooth
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 4;
fade-exclude = [
    "class_g = 'Alacritty'"
];

# Anti-flicker
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;

# Ensure rounded corners apply to all normal windows and dialogs
# Note: "alacritty" is not one of picom's recognized wintypes keys
# (those are fixed X11 window-type categories, not app class names),
# so it parses but has no effect - the shadow-exclude, opacity-rule,
# and fade-exclude entries above/below are what actually make
# Alacritty bypass those effects.
wintypes = {
    normal = { corner-radius = 15; };
    dialog = { corner-radius = 15; };
    alacritty = {
        shadow = false;
        opacity = 1.0;
        fading = false;
    };
};

corner-radius-rules = [
    "15:class_g = 'Alacritty'"
];

opacity-rule = [
    "100:class_g = 'Alacritty'"
];

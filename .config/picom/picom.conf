# rice - picom config, bare-minimum performance mode
# Only rounded corners + minimal anti-flicker; no shadow/fade/blur/opacity

backend = "xrender";
vsync = false;

# Rounded corners
corner-radius = 15;
round-borders = 1;

# Effects disabled for performance
shadow = false;
fading = false;
blur-background = false;

# Minimal anti-flicker
use-damage = true;
detect-rounded-corners = true;

# Rounded corners on normal windows and dialogs
wintypes = {
    normal = { corner-radius = 15; };
    dialog = { corner-radius = 15; };
};

corner-radius-rules = [
    "15:class_g = 'Alacritty'"
];

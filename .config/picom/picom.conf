# rice - picom config
# Dark grey/black aesthetic: rounded corners, soft blur, subtle shadows, no flicker

backend = "glx";
vsync = true;

# Corners
corner-radius = 15;
round-borders = 1;
rounded-corners-exclude = [
    "class_g = 'polybar'"
];

# Blur
blur-method = "gaussian";
blur-strength = 5;
blur-background = true;
blur-background-exclude = [
    "class_g = 'polybar'"
];

# Opacity
active-opacity = 0.85;
inactive-opacity = 0.85;
frame-opacity = 0.85;
opacity-rule = [
    "85:class_g = 'Alacritty'",
    "100:class_g = 'polybar'",
    "85:class_g = 'Rofi'"
];

# Shadows - subtle
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.25;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
    "class_g = 'polybar'",
    "class_g = 'Rofi'"
];

# Anti-flicker
unredir-if-possible = false;
detect-client-opacity = true;
detect-rounded-corners = true;
detect-transient = true;
use-damage = true;

# Fading - smooth, not excessive
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 4;

wintypes = {
    tooltip = { opacity = 0.9; };
    dock = { opacity = 1.0; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
};

# rice - picom config, unified B/W minimal theme

backend = "glx";
vsync = true;

# Blur
blur-method = "gaussian";
blur-strength = 5;
blur-background = true;
blur-background-exclude = [
    "class_g = 'polybar'"
];

# Rounded corners
corner-radius = 15;
round-borders = 1;

# Opacity
active-opacity = 0.85;
inactive-opacity = 0.85;
frame-opacity = 0.85;

# Shadows - subtle
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.25;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
    "class_g = 'polybar'"
];

# Fading - smooth
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 4;

# Anti-flicker
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
